<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Legal Assistant Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Noto+Serif+Bengali:wght@400;500&display=swap">
<style>
/* Frontend-only prototype: every answer is mocked in the script below; nothing leaves the browser.
   Colours are the Release 1 report's: paper, bottle-green ink, flag green, flag red for urgent only. */
:root {
  --paper: #f4f6f2;
  --paper-2: #e4eae3;
  --white: #ffffff;
  --line: #d5ddd7;
  --ink: #0d2a1c;
  --soft: #4f665a;
  --green: #006a4e;
  --green-2: #c9ddd1;
  --green-3: #e3f1ea;
  --green-ink: #00543e;
  --file-bg: #eceff5;
  --file-ink: #33405a;
  --accent: #c8102e;
  --accent-bg: #fbeef0;
  --side-fg: #e6ede8;
  --side-soft: #9fb5a8;
  --side-hover: #173a2a;
  --side-active: #1f4835;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read: "Literata", Georgia, serif;
  --bn: "Noto Serif Bengali", "Literata", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:lang(bn), .bn { font-family: var(--bn); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.dots { stroke-width: 3; }
h1, h2, h3, p { margin: 0; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* ---------- Sidebar ---------- */
.side { background: var(--ink); color: var(--side-fg); display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; font-weight: 600; font-size: 16px; }
/* logo.png keeps its white ground as a tile so the black of the figure stays visible on the dark sidebar */
.logo { width: 36px; height: 36px; border-radius: 8px; background: #fff; object-fit: cover; display: block; }
.brand .close { margin-left: auto; display: none; }
.nl { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; color: inherit; }
.nl:hover { background: var(--side-hover); }
.nl[aria-current="page"] { background: var(--side-active); }
.nl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.new { border: 1px solid #2c5341; margin-bottom: 6px; }
.lbl { font-size: 12px; color: var(--side-soft); padding: 16px 10px 6px; }
.side .scroll { overflow-y: auto; flex: 1; min-height: 0; margin: 0 -4px; padding: 0 4px; }
.side .none { font-size: 13px; color: var(--side-soft); padding: 4px 10px; }
.sub .nl { padding: 6px 10px 6px 38px; font-size: 14px; color: var(--side-soft); }
.sub .nl[aria-current="page"] { color: var(--side-fg); }
.ws { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 8px; margin-top: 8px; border: 0; border-top: 1px solid #23493a; background: none; color: inherit; text-align: left; font-size: 13px; border-radius: 0 0 8px 8px; }
.ws:hover { background: var(--side-hover); }
.ws > span:nth-child(2) { min-width: 0; flex: 1; }
.ws small { display: block; color: var(--side-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--green-2); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }

/* ---------- Main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 16px; border-bottom: 1px solid var(--line); }
.top h2 { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.crumb { color: var(--soft); background: none; border: 0; padding: 0; white-space: nowrap; }
.crumb:hover { color: var(--ink); text-decoration: underline; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--soft); flex: none; }
.ib:hover { background: var(--paper-2); color: var(--ink); }
.ib[aria-pressed="true"] { color: var(--green); }
.ib.menu-btn { display: none; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--white); border-radius: 9px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--paper); }
.btn.pri { background: var(--green); color: #fff; border-color: var(--green); }
.btn.pri:hover { background: #005a42; }
.btn.danger { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.ghost-danger { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--green-3); color: var(--green-ink); border: 0; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pill.grey { background: var(--paper-2); color: var(--soft); }
.right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.view { flex: 1; overflow-y: auto; min-height: 0; }

/* ---------- Menus ---------- */
.pop { position: fixed; z-index: 60; min-width: 230px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(13, 42, 28, .16); padding: 6px; }
.pop .who { padding: 8px 10px 10px; font-size: 13px; color: var(--soft); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.pop .who b { display: block; color: var(--ink); font-size: 14px; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; color: var(--ink); text-decoration: none; }
.mi:hover { background: var(--paper); }
.mi.danger { color: var(--accent); }
.mi .chk { margin-left: auto; color: var(--green); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ---------- Home ---------- */
.home { min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 22px; padding: 24px 20px 12vh; }
.home h1 { font: 500 clamp(28px, 4vw, 38px)/1.15 var(--read); letter-spacing: -0.02em; text-align: center; }
.home .composer, .home .disc { width: min(760px, 100%); }
.sugs { width: min(760px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sug { text-align: left; border: 1px solid var(--line); background: var(--white); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--soft); }
.sug b { display: block; color: var(--ink); font-weight: 500; }
.sug:hover { border-color: var(--green-2); background: var(--green-3); }

/* ---------- Thread ---------- */
.thread { max-width: 780px; margin: 0 auto; padding: 28px 20px 28px; display: grid; gap: 30px; }
.msg.user { justify-self: end; background: var(--paper-2); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { font: 17px/1.7 var(--read); min-width: 0; }
.msg.bot .body p + p { margin-top: 10px; }
.msg.note { justify-self: center; font-size: 13px; color: var(--green-ink); background: var(--green-3); border-radius: 999px; padding: 6px 14px; display: flex; gap: 8px; align-items: center; text-align: center; }
.status { font: 13px/1.4 var(--ui); color: var(--soft); display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.cite { font: 600 12px/1 var(--ui); background: var(--green-3); color: var(--green-ink); border: 0; border-radius: 5px; padding: 4px 7px; margin: 0 2px; vertical-align: 1px; white-space: nowrap; }
.cite:hover { background: var(--green-2); }
.cite.file { background: var(--file-bg); color: var(--file-ink); }
.ask-back { margin-top: 12px; font-weight: 500; border-left: 3px solid var(--green); padding-left: 12px; }
.sources { margin-top: 14px; font: 13px/1.4 var(--ui); background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; display: grid; }
.src { display: flex; justify-content: space-between; gap: 12px; border: 0; background: none; padding: 7px 0; text-align: left; }
.src + .src { border-top: 1px solid #edf1ee; }
.src span:last-child { color: var(--green-ink); white-space: nowrap; }
.src.file span:last-child { color: var(--file-ink); }
.handoff { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--accent-bg); border-radius: 12px; padding: 12px 14px; font: 14px/1.45 var(--ui); }
.handoff .btn { background: var(--accent); border-color: var(--accent); color: #fff; }
.acts { display: flex; gap: 2px; margin-top: 6px; align-items: center; }
.acts .ib { width: 30px; height: 30px; }
.acts .flagged { font: 12px var(--ui); color: var(--soft); margin-left: 6px; }
.down svg { transform: scaleY(-1); }

/* ---------- Composer ---------- */
.dock { flex: none; padding: 0 20px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.composer { max-width: 780px; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px 8px 16px; display: grid; gap: 6px; box-shadow: 0 2px 6px rgba(13, 42, 28, .05); }
.composer:focus-within { border-color: var(--green); }
.composer textarea { width: 100%; border: 0; resize: none; background: transparent; font-size: 16px; line-height: 1.5; max-height: 200px; outline: none; padding: 0; }
.c-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; background: var(--paper); border-radius: 9px; padding: 2px; width: max-content; }
.seg button { border: 0; background: none; font-size: 13px; padding: 5px 10px; border-radius: 7px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 2px rgba(13, 42, 28, .12); }
.ctx { font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.send { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 11px; background: var(--green); color: #fff; display: grid; place-items: center; }
.send:disabled { background: var(--green-2); cursor: default; }
.disc { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--soft); }

/* ---------- Pages ---------- */
.page { max-width: 1000px; margin: 0 auto; padding: 28px 24px 48px; }
.page.narrow { max-width: 760px; }
.page-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h h1 { font: 500 28px/1.2 var(--read); letter-spacing: -0.01em; }
.page-h p { width: 100%; color: var(--soft); font-size: 14px; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--white); padding: 10px 14px; margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--white); border-radius: 14px; padding: 16px; display: grid; gap: 6px; }
.card:hover { border-color: var(--green); }
.card b { font: 600 17px/1.3 var(--read); }
.card .m { color: var(--soft); font-size: 13px; }
.empty { color: var(--soft); padding: 24px 0; }

.mv { max-width: 1140px; margin: 0 auto; padding: 24px 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: start; }
.mv h1 { font: 500 30px/1.2 var(--read); letter-spacing: -0.01em; }
.meta { color: var(--soft); font-size: 14px; margin: 6px 0 20px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.mv .composer { max-width: none; }
.mv .disc { text-align: left; margin-left: 4px; }
.list-h { font-size: 13px; font-weight: 600; color: var(--soft); margin: 28px 0 8px; }
.rowlink { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 4px; }
.rowlink:hover { background: var(--white); }
.rowlink span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rowlink small { color: var(--soft); white-space: nowrap; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.panel + .panel { margin-top: 12px; }
.panel h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; resize: vertical; font-size: 14px; background: var(--paper); }
.panel .note { font-size: 12px; color: var(--soft); }
.frow-wrap { display: flex; gap: 4px; align-items: center; }
.frow { display: flex; gap: 10px; align-items: center; border: 0; background: var(--paper); border-radius: 9px; padding: 8px 10px; text-align: left; flex: 1; min-width: 0; }
.frow:hover { background: var(--paper-2); }
.frow .n { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.frow small { display: block; font-size: 12px; color: var(--soft); }
.frow small.busy { color: var(--green-ink); }
dl.det { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
dl.det dt { color: var(--soft); }
dl.det dd { margin: 0; }

/* settings + members */
.sec { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.sec + .sec { margin-top: 14px; }
.sec h2 { font-size: 16px; font-weight: 600; }
.sec .hint { font-size: 13px; color: var(--soft); margin-top: -8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--soft); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--paper); color: var(--ink); font-size: 15px; width: 100%; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.line small { display: block; color: var(--soft); font-size: 13px; }
.save-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.mem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mem:first-of-type { border-top: 0; }
.mem .who { min-width: 0; }
.mem .who b { font-weight: 500; display: block; }
.mem .who small { color: var(--soft); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; }
.mem select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--white); font-size: 14px; }
.invite { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 10px; }
.invite input, .invite select { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--paper); font-size: 15px; }

/* sign in */
.app.bare { grid-template-columns: 1fr; }
.app.bare .side, .app.bare .top, .app.bare .dock { display: none; }
.signin { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.signin form { width: min(400px, 100%); background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: grid; gap: 14px; }
.signin .logo { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); }
.signin h1 { font: 500 26px/1.2 var(--read); }
.signin .sm { font-size: 13px; color: var(--soft); }
.signin .lnk { background: none; border: 0; padding: 0; color: var(--green-ink); text-decoration: underline; font-size: 14px; justify-self: start; }

/* ---------- Drawer, dialog, toast ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--white); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(13, 42, 28, .10); transform: translateX(102%); transition: transform .25s ease; z-index: 30; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .in { padding: 18px 20px; overflow-y: auto; display: grid; gap: 14px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.drawer h3 { font: 600 20px/1.3 var(--read); }
.drawer .txt { font: 16px/1.7 var(--read); background: var(--paper); border-radius: 10px; padding: 14px 16px; }
.drawer .ver { font-size: 13px; color: var(--soft); }
.page-mock { aspect-ratio: 1 / 1.3; background: var(--paper); border-radius: 8px; display: grid; place-items: center; color: var(--soft); font-size: 13px; text-align: center; padding: 20px; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(500px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(13, 42, 28, .25); color: var(--ink); }
dialog::backdrop { background: rgba(13, 42, 28, .45); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h3 { font: 600 20px/1.3 var(--read); }
dialog p.lead { font-size: 14px; color: var(--soft); }
dialog .box { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 14px; max-height: 140px; overflow-y: auto; }
dialog .opt { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
dialog .opt input { margin-top: 3px; accent-color: var(--green); }
dialog .share-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 130px; gap: 10px; align-items: center; font-size: 14px; }
dialog .share-row select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--white); }
.f-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.err { color: var(--accent); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--side-fg); padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: .2s; pointer-events: none; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-102%); transition: transform .25s ease; }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(13, 42, 28, .45); z-index: 35; }
  .brand .close, .ib.menu-btn { display: grid; }
  .mv { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 40px; }
  .page { padding: 20px 16px 40px; }
  .sugs, .grid2 { grid-template-columns: 1fr; }
  .thread { padding: 20px 16px; }
  .dock { padding-left: 12px; padding-right: 12px; }
  .top .crumb, .top .crumb + span { display: none; }
  .invite { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .invite input, .invite select { width: 100%; min-width: 0; }
  .invite button { grid-column: 1 / -1; }
  .mem { grid-template-columns: auto minmax(0, 1fr) auto; }
  .mem select { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, .side, .toast { transition: none; }
  .pulse { animation: none; }
}
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div class="scrim" data-act="menu"></div>
  <div class="main">
    <header class="top" id="top"></header>
    <div class="view" id="view"></div>
    <div class="dock" id="dock"></div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Source" inert>
  <header><strong id="dr-kind">Source</strong><button class="ib right" data-act="close-drawer" aria-label="Close source"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="in" id="dr-body"></div>
</aside>

<div class="pop" id="pop" hidden></div>
<dialog id="dlg"></dialog>
<input type="file" id="files" multiple hidden accept=".pdf,.doc,.docx,.txt,image/*">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var I = {

        + S.members.filter(function (p) { return !p.you; }).map(function (p) {
          var cur = m.share[p.email] || '';
          return '<div class="share-row"><span class="av">' + initials(p.name) + '</span><span>' + esc(p.name) + '<br><small style="color:var(--soft)">' + p.role + '</small></span><select data-share="' + esc(p.email) + '" aria-label="Access for ' + esc(p.name) + '"><option value=""' + (cur ? '' : ' selected') + '>No access</option><option value="view"' + (cur === 'view' ? ' selected' : '') + '>Can view</option>' + (p.role === 'Viewer' ? '' : '<option value="edit"' + (cur === 'edit' ? ' selected' : '') + '>Can edit</option>') + '</select></div>';
        }).join('') + '<button type="button" class="btn" data-act="copy-link" style="justify-self:start">' + ic('copy') + 'Copy link</button>',
        onSubmit: function (f) { m.share = {}; f.querySelectorAll('[data-share]').forEach(function (s) { if (s.value) m.share[s.dataset.share] = s.value; }); render(); toast(sharedCount(m) ? 'Shared with ' + plural(sharedCount(m), 'person') .replace('persons', 'people') + '.' : 'This matter is now private.'); } });
    },
    'copy-link': function () { try { navigator.clipboard.writeText('https://app.example/matters/' + S.view.id).then(function () { toast('Link copied. Only people with access can open it.'); }, function () { toast('Copy is blocked here.'); }); } catch (e) { toast('Copy is blocked here.'); } },
    'remove-member': function (b) {
      var p = S.members[+b.dataset.i];
      modal({ title: 'Remove ' + p.name + '?', danger: true, submit: 'Remove', body: '<p class="lead">They lose access to every matter in this workspace at once. Their chats stay with the matters.</p>',
        onSubmit: function () { S.members.splice(S.members.indexOf(p), 1); S.matters.forEach(function (m) { delete m.share[p.email]; }); render(); toast(p.name + ' removed.'); } });
    }
  };

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!e.target.closest('#pop') && !(b && /-menu$/.test(b.dataset.act))) hideMenu();
    if (!b) return;
    if (b.closest('#pop')) hideMenu();
    var fn = A[b.dataset.act]; if (fn) fn(b);
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'filter') { S.filter = e.target.value; var pos = e.target.selectionStart; render(); var f = $('#filter'); f.focus(); f.setSelectionRange(pos, pos); } });
  document.addEventListener('change', function (e) {
    if (e.target.dataset.role) { var p = S.members[+e.target.dataset.role]; p.role = e.target.value; toast(p.name + ' is now ' + p.role.toLowerCase() + '.'); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); hideMenu(); $('#app').classList.remove('nav-open'); } });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'settings-form') {
      e.preventDefault();
      var u = S.user, n = $('#s-name').value.trim(), em = $('#s-email').value.trim();
      if (!n || !/^\S+@\S+\.\S+$/.test(em)) { toast('Enter your name and a valid email.'); return; }
      u.name = n; u.email = em; u.phone = $('#s-phone').value.trim(); u.kind = $('#s-kind').value; u.answerLang = $('#s-alang').value; S.mode = $('#s-mode').value;
      var ui = $('#s-ui').value; u.ui = ui;
      S.members.forEach(function (p) { if (p.you) { p.name = n; p.email = em; } });
      render(); toast(ui === 'bn' ? 'Saved. The product ships with a Bangla interface; this demo stays in English.' : 'Settings saved.');
    } else if (f.id === 'invite-form') {
      e.preventDefault();
      var email = $('#inv-email').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Enter a valid email address.'); return; }
      if (S.members.some(function (p) { return p.email === email; })) { toast('That person is already in the workspace.'); return; }
      S.members.push({ email: email, name: email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, function (x) { return x.toUpperCase(); }), role: $('#inv-role').value, invited: true });
      render(); toast('Invite sent to ' + email + '.');
    } else if (f.id === 'signin-form') {
      e.preventDefault();
      if (!/^\S+@\S+\.\S+$/.test($('#si-email').value.trim())) { $('#si-err').hidden = false; return; }
      go({ name: 'home' }); toast('Signed in.');
    }
  });

  render();
})();
</script>
