<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Legal Assistant Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Noto+Serif+Bengali:wght@400;500&display=swap">
<style>
/* Supervisor console prototype. Sample data only; reports and lawyer requests made in index.html
   in the same browser are read from localStorage so the demo shows the loop end to end. */
:root {
  --paper: #f4f6f2; --paper-2: #e4eae3; --white: #ffffff; --line: #d5ddd7; --row: #edf1ee;
  --ink: #0d2a1c; --soft: #4f665a; --green: #006a4e; --green-2: #c9ddd1; --green-3: #e3f1ea; --green-ink: #00543e;
  --accent: #c8102e; --accent-bg: #fbeef0; --amber: #8a5a00; --amber-bg: #fbf1dc;
  --side-fg: #e6ede8; --side-soft: #9fb5a8; --side-hover: #173a2a; --side-active: #1f4835;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --read: "Literata", Georgia, serif; --bn: "Noto Serif Bengali", "Literata", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:lang(bn), .bn { font-family: var(--bn); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3, p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100%; }
.side { background: var(--ink); color: var(--side-fg); display: flex; flex-direction: column; padding: 12px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 4px; font-weight: 600; font-size: 16px; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--side-soft); }
.logo { width: 36px; height: 36px; border-radius: 8px; background: #fff; object-fit: cover; }
.side nav { display: grid; gap: 2px; margin-top: 18px; overflow-y: auto; }
.nl { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; color: inherit; text-decoration: none; font-size: 14px; }
.nl:hover { background: var(--side-hover); }
.nl[aria-current="page"] { background: var(--side-active); }
.nl .n { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; font-weight: 600; }
.lbl { font-size: 12px; color: var(--side-soft); padding: 14px 10px 4px; }
.side .foot { margin-top: auto; border-top: 1px solid #23493a; padding: 10px 8px 2px; display: grid; gap: 8px; font-size: 13px; }
.side .foot small { display: block; color: var(--side-soft); }
.side .foot .who { display: flex; gap: 10px; align-items: center; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--green-2); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--soft); }
.menu-btn { display: none !important; }
.view { flex: 1; overflow-y: auto; min-height: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 56px; }
.ph { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 22px; }
.ph h1 { font: 500 28px/1.2 var(--read); letter-spacing: -0.01em; }
.ph p { width: 100%; color: var(--soft); font-size: 14px; margin-top: -6px; }
.ph .right { margin-left: auto; display: flex; gap: 8px; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--soft); }
.ib:hover { background: var(--paper-2); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--white); border-radius: 9px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--paper); }
.btn.pri { background: var(--green); color: #fff; border-color: var(--green); }
.btn.pri:hover { background: #005a42; }
.btn.danger { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; background: var(--paper-2); color: var(--soft); font-weight: 500; }
.chip.ok { background: var(--green-3); color: var(--green-ink); }
.chip.warn { background: var(--amber-bg); color: var(--amber); }
.chip.bad { background: var(--accent-bg); color: var(--accent); }
.chip.new { background: var(--ink); color: #fff; }
.sample { margin-left: auto; }

/* overview */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 4px; }
.kpi span { font-size: 13px; color: var(--soft); }
.kpi b { font: 500 30px/1.1 var(--read); letter-spacing: -0.01em; }
.kpi small { font-size: 13px; color: var(--soft); }
.kpi small .up { color: var(--green-ink); font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .chip { margin-left: auto; }
.todo { display: grid; }
.todo button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 11px 4px; border-top: 1px solid var(--row); text-align: left; width: 100%; }
.todo button:first-child { border-top: 0; }
.todo button:hover { background: var(--paper); }
.todo .c { font: 600 20px/1 var(--read); min-width: 34px; text-align: right; }
.todo .t { flex: 1; } .todo .t small { display: block; color: var(--soft); font-size: 13px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 190px; padding-top: 18px; }
.bar { display: grid; gap: 6px; justify-items: center; align-self: stretch; grid-template-rows: 1fr auto; }
.bar i { width: 100%; max-width: 46px; background: var(--green-2); border-radius: 6px 6px 0 0; align-self: end; position: relative; }
.bar.today i { background: var(--green); }
.bar i b { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font: 600 12px var(--ui); color: var(--soft); }
.bar.today i b { color: var(--ink); }
.bar span { font-size: 12px; color: var(--soft); }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; }
.split i:nth-child(1) { background: var(--green); } .split i:nth-child(2) { background: var(--green-2); } .split i:nth-child(3) { background: var(--accent); }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: center; } .legend div b { margin-left: auto; font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; } .kv dt { color: var(--soft); } .kv dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
dl { margin: 0; }

/* tables */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px; font-size: 14px; color: var(--soft); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--green); font-weight: 600; }
.tbl-wrap { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td:first-child { white-space: nowrap; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--soft); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-top: 1px solid var(--row); vertical-align: middle; }
tr:first-child td { border-top: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--paper); }
td small { display: block; color: var(--soft); font-size: 13px; }
.search { border: 1px solid var(--line); border-radius: 10px; background: var(--white); padding: 8px 12px; min-width: 260px; }

/* two-pane queue */
.pane { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 12px; align-items: start; }
.qlist { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.qi { display: grid; gap: 4px; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; border-top: 1px solid var(--row); }
.qi:first-child { border-top: 0; }
.qi:hover { background: var(--paper); }
.qi[aria-current="true"] { background: var(--green-3); }
.qi .l1 { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--soft); }
.qi .l1 .chip { font-size: 11px; }
.qi .l1 time { margin-left: auto; }
.qi b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.detail h2 { font: 600 20px/1.3 var(--read); }
.detail .meta { font-size: 13px; color: var(--soft); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.blk { display: grid; gap: 6px; } .blk > span { font-size: 13px; color: var(--soft); font-weight: 600; }
.quote { background: var(--paper); border-radius: 10px; padding: 12px 14px; font: 16px/1.65 var(--read); }
.quote.user { font-family: var(--ui); font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.detail textarea, .detail input, .detail select, .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--paper); font-size: 14px; width: 100%; color: var(--ink); }
.opt { display: flex; gap: 8px; align-items: center; font-size: 14px; } .opt input { accent-color: var(--green); width: auto; }
.empty { color: var(--soft); padding: 28px 16px; text-align: center; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.diff div { background: var(--paper); border-radius: 10px; padding: 12px; font-size: 14px; } .diff div b { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
.diff mark { background: var(--amber-bg); color: var(--amber); padding: 0 3px; border-radius: 3px; }

/* settings + quality */
.sec { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.sec + .sec { margin-top: 12px; }
.sec h2 { font-size: 16px; font-weight: 600; }
.sec .hint { font-size: 13px; color: var(--soft); margin-top: -8px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--soft); }
.line { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.line small { display: block; color: var(--soft); font-size: 13px; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + i { background: var(--green); } .switch input:checked + i::after { left: 21px; }
.switch input:focus-visible + i { outline: 2px solid var(--green); outline-offset: 2px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-bg); color: var(--accent); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.tag button { border: 0; background: none; color: inherit; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; padding: 0; }
.tag button:hover { background: rgba(200, 16, 46, .12); }
.tag button svg { width: 14px; height: 14px; }
.addtag { display: flex; gap: 8px; } .addtag input { max-width: 260px; }
.save-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; align-items: center; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.metric { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.metric span { font-size: 13px; color: var(--soft); }
.metric b { font: 500 28px/1.1 var(--read); }
.metric .track { height: 6px; background: var(--paper-2); border-radius: 3px; position: relative; }
.metric .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--green); }
.metric .track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.metric small { font-size: 12px; color: var(--soft); }
.prog { height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s; }

dialog { border: 0; border-radius: 16px; padding: 0; width: min(480px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(13, 42, 28, .25); color: var(--ink); }
dialog::backdrop { background: rgba(13, 42, 28, .45); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h3 { font: 600 20px/1.3 var(--read); }
dialog .lead { font-size: 14px; color: var(--soft); }
.f-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.err { color: var(--accent); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--side-fg); padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: .2s; pointer-events: none; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid, .pane { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 40; transform: translateX(-102%); transition: transform .25s ease; }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(13, 42, 28, .45); z-index: 35; }
  .menu-btn { display: grid !important; }
  .page { padding: 20px 16px 40px; }
  .g2, .diff { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .side, .toast, .switch i, .prog i { transition: none; } }
</style>
</head>

</div>
<dialog id="dlg"></dialog>

    var t = curTab('people', 'users'), q = D.q.toLowerCase();
    var h = head('Users and workspaces', '1,930 accounts, 412 active this week. Firms manage their own members; you step in for suspensions, resets and disputes.', '<input class="search" id="q" type="search" placeholder="Search by name or workspace" aria-label="Search users" value="' + esc(D.q) + '">')
      + tabs('people', [['users', 'Users'], ['ws', 'Workspaces']]);
    if (t === 'users') {
      var rows = D.users.filter(function (u) { return (u[0] + ' ' + u[2]).toLowerCase().indexOf(q) > -1; });
      return h + '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Uses it as</th><th>Workspace</th><th>Last active</th><th>Status</th><th></th></tr></thead><tbody>'
        + (rows.length ? rows.map(function (u) { var i = D.users.indexOf(u); return '<tr><td><span style="display:flex;gap:10px;align-items:center"><span class="av">' + initials(u[0]) + '</span>' + esc(u[0]) + '</span></td><td>' + u[1] + '</td><td>' + esc(u[2]) + '</td><td>' + u[3] + '</td><td><span class="chip ' + (u[4] === 'Active' ? 'ok' : 'bad') + '">' + u[4] + '</span></td><td style="text-align:right;white-space:nowrap"><button class="btn" data-act="reset" data-i="' + i + '">Reset password</button> <button class="btn" data-act="suspend" data-i="' + i + '">' + (u[4] === 'Active' ? 'Suspend' : 'Restore') + '</button></td></tr>'; }).join('')
          : '<tr><td colspan="6" class="empty">No user matches that search.</td></tr>') + '</tbody></table></div>';
    }
    var ws = D.workspaces.filter(function (w) { return w[0].toLowerCase().indexOf(q) > -1; });
    return h + '<div class="tbl-wrap"><table><thead><tr><th>Workspace</th><th>Type</th><th>Members</th><th>Matters</th><th>Created</th></tr></thead><tbody>'
      + (ws.length ? ws.map(function (w) { return '<tr><td>' + esc(w[0]) + '</td><td>' + w[1] + '</td><td class="tnum">' + w[2] + '</td><td class="tnum">' + w[3] + '</td><td>' + w[4] + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">No workspace matches that search.</td></tr>')
      + '</tbody></table></div><p style="font-size:13px;color:var(--soft);margin-top:10px">You see counts only. Matter files and chats stay private to each workspace.</p>';
  };

  V.settings = function () {
    var s = D.settings;
    return head('Assistant settings', 'How the assistant answers. Every change is checked against the 150 reference questions before it goes live.')
      + '<form id="settings-form"><section class="sec"><h2>Answers</h2>'
      + fld('Disclaimer under every answer', '<textarea id="st-disc" rows="2">' + esc(s.disclaimer) + '</textarea>')
      + '<div class="line"><span>Show the corpus date on answers<small>Users see which date the law is current to.</small></span>' + sw('st-date', s.showDate, 'Show the corpus date') + '</div>'
      + '<div class="g2">' + fld('Default answer style for new users', '<select id="st-style"><option value="simple"' + (s.style === 'simple' ? ' selected' : '') + '>Simple</option><option value="pro"' + (s.style === 'pro' ? ' selected' : '') + '>Professional</option></select>')
      + fld('Questions per user per day', '<input id="st-limit" type="number" min="10" max="1000" value="' + s.limit + '">') + '</div>'
      + '<div class="line"><span>Bangla</span>' + sw('st-bn', s.bn, 'Answer in Bangla') + '</div><div class="line"><span>English</span>' + sw('st-en', s.en, 'Answer in English') + '</div></section>'
      + '<section class="sec"><h2>Send to a lawyer instead of answering</h2><p class="hint">Questions on these topics get the lawyer handoff, not general information.</p><div class="tags">'
      + s.topics.map(function (t, i) { return '<span class="tag">' + esc(t) + '<button type="button" data-act="rm-topic" data-i="' + i + '" aria-label="Remove ' + esc(t) + '">' + ic('x') + '</button></span>'; }).join('')
      + '</div><div class="addtag"><input id="new-topic" placeholder="Add a topic, e.g. Eviction notice" aria-label="New topic" style="border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--paper)"><button type="button" class="btn" data-act="add-topic">' + ic('plus') + 'Add</button></div></section>'
      + '<section class="sec"><h2>Model</h2><div class="line"><span>Main model<small>Qwen3.6-27B on the GPU server. Data stays on your servers.</small></span><span class="chip ok">Running</span></div>'
      + '<div class="line"><span>Paid API when the server is busy<small>Off keeps every question on your own server.</small></span>' + sw('st-fb', s.fallback, 'Use the paid API when busy') + '</div></section>'
      + '<div class="save-row"><span id="save-state" style="font-size:13px;color:var(--soft)"></span><button type="submit" class="btn pri">Check and save</button></div></form>';
  };

  V.quality = function () {
    var x = D.runs[0], m = [['r', 'Right section in top 5', '%', 'at least ' + BARS.r + '%'], ['c', 'Citations valid', '%', 'must be 100%'], ['f', 'Refuses out-of-scope', '%', 'at least ' + BARS.f + '%'], ['a', 'Answers graded correct', '%', 'at least ' + BARS.a + '%, 0 dangerous'], ['p', 'Bangla vs English gap', ' pts', 'at most ' + BARS.p + ' pts']];
    return head('Quality checks', '150 reference questions, signed off by the client, run before every release and after every change. A failed check holds the release.', '<button class="btn pri" data-act="run" id="run-btn">' + ic('play') + 'Run now</button>')
      + '<div class="prog" id="run-prog" hidden style="margin-bottom:12px"><i></i></div>'
      + '<div class="metrics tnum">' + m.map(function (k) {
        var v = x[k[0]], ok = k[0] === 'p' ? v <= BARS.p : v >= BARS[k[0]];
        var w = k[0] === 'p' ? Math.min(100, v / 10 * 100) : v, bar = k[0] === 'p' ? BARS.p * 10 : BARS[k[0]];
        return '<div class="metric"><span>' + k[1] + '</span><b>' + v + k[2] + '</b><div class="track"><i style="width:' + w + '%;background:' + (ok ? 'var(--green)' : 'var(--accent)') + '"></i><u style="left:' + bar + '%"></u></div><small>' + (ok ? 'Passes: ' : 'Fails: ') + k[3] + '</small></div>';
      }).join('') + '</div>'
      + '<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Run</th><th>Why it ran</th><th>Top 5</th><th>Citations</th><th>Refusal</th><th>Correct</th><th>BN/EN gap</th><th>Result</th></tr></thead><tbody>'
      + D.runs.map(function (r) { return '<tr><td>' + r.date + '</td><td>' + esc(r.by) + '</td><td class="tnum">' + r.r + '%</td><td class="tnum">' + r.c + '%</td><td class="tnum">' + r.f + '%</td><td class="tnum">' + r.a + '%</td><td class="tnum">' + r.p + ' pts</td><td>' + (passes(r) ? '<span class="chip ok">Passed</span>' : '<span class="chip bad">Held release</span>') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  };

  V.audit = function () {
    return head('Audit log', 'Every change to the law, the settings and user accounts, with who made it.')
      + '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>'
      + D.audit.map(function (a) { return '<tr><td style="white-space:nowrap">' + esc(a[0]) + '</td><td>' + esc(a[1]) + '</td><td>' + esc(a[2]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  };

  function render() {
    renderSide();
    var n = NAV.find(function (x) { return x[0] === D.view; });
    $('#crumb').textContent = 'Admin console / ' + n[2];
    $('#view').innerHTML = '<div class="page">' + V[D.view]() + '</div>';
  }
  function go(v) { D.view = v; $('#app').classList.remove('nav-open'); $('#view').scrollTop = 0; render(); }
  var tt; function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2800); }
  function modal(o) {
    var d = $('#dlg');
    d.innerHTML = '<form id="mf" novalidate><h3>' + esc(o.title) + '</h3>' + o.body + '<p class="err" id="merr" hidden></p><div class="f-actions"><button type="button" class="btn" data-act="close-dlg">Cancel</button><button type="submit" class="btn ' + (o.danger ? 'danger' : 'pri') + '">' + esc(o.submit) + '</button></div></form>';
    d.showModal(); var first = d.querySelector('input, textarea, select'); if (first) first.focus();
    $('#mf').onsubmit = function (e) { e.preventDefault(); var err = o.onSubmit(); if (err) { $('#merr').textContent = err; $('#merr').hidden = false; } else d.close(); };
  }
  function runCheck(by, done) {
    var btn = $('#run-btn'), p = $('#run-prog'), k = 0;
    if (btn) btn.disabled = true; if (p) p.hidden = false;
    (function step() {
      k += 10; var bar = $('#run-prog i'); if (bar) bar.style.width = k + '%';
      if (k < 100) { setTimeout(step, 180); return; }
      var x = D.runs[0], r = { date: '7 Mar 2027', by: by, r: Math.min(95, x.r + 1), c: 100, f: x.f, a: Math.min(95, x.a + 1), p: Math.max(1, x.p - 1) };
      D.runs.unshift(r); D.audit.unshift([when(new Date().toISOString()), 'System', 'Quality check ' + (passes(r) ? 'passed' : 'failed') + ' (' + by.toLowerCase() + ')']);
      if (done) done(r); else { render(); toast(passes(r) ? 'Quality check passed. All five bars met.' : 'Quality check failed. The release is held.'); }
    })();
  }

  var A = {
    nav: function (b) { go(b.dataset.v); },
    menu: function () { $('#app').classList.toggle('nav-open'); },
    tab: function (b) { D.tab[b.dataset.k] = b.dataset.t; render(); },
    pick: function (b) { D.sel[b.dataset.k] = b.dataset.id; render(); },
    'close-dlg': function () { $('#dlg').close(); },
    'review-ok': function (b) { var r = D.reviews.find(function (x) { return x.id === b.dataset.id; }); r.done = 'Kept as is'; log('Reviewed "' + r.q + '": answer kept'); D.sel.review = null; render(); toast('Marked as right. ' + plural(openReviews().length, 'answer') + ' left to review.'); },
    'review-fix': function (b) {
      var r = D.reviews.find(function (x) { return x.id === b.dataset.id; }), fix = $('#fix').value.trim(), ref = $('#addref').checked;
      if (!fix) { toast('Write the corrected answer first, or choose "Answer was right".'); $('#fix').focus(); return; }
      r.done = ref ? 'Corrected · added to reference questions' : 'Corrected'; r.fix = fix;
      log('Corrected the answer to "' + r.q + '"' + (ref ? ' and added it to the reference questions' : '')); D.sel.review = null; render();
      toast(ref ? 'Saved. It is now one of the reference questions.' : 'Correction saved.');
    },
    approve: function (b) { var i = D.updates.findIndex(function (u) { return u.id === b.dataset.id; }), u = D.updates[i], from = $('#valid-from').value.trim() || u.from; D.updates.splice(i, 1); log('Approved ' + u.act + ' ' + u.sec + ', in force from ' + from); D.sel.update = null; render(); toast('Published. Answers use the new version from ' + from + '.'); },
    reject: function (b) {
      var i = D.updates.findIndex(function (u) { return u.id === b.dataset.id; }), u = D.updates[i];
      modal({ title: 'Reject this update?', danger: true, submit: 'Reject', body: '<p class="lead">' + esc(u.act) + ' ' + esc(u.sec) + ' stays as it is now. Add a reason for the log.</p>' + fld('Reason', '<input id="rj" placeholder="e.g. Detected change is a typo on the source site">'),
        onSubmit: function () { var why = $('#rj').value.trim(); if (!why) return 'Add a reason.'; D.updates.splice(i, 1); log('Rejected ' + u.act + ' ' + u.sec + ': ' + why); D.sel.update = null; render(); toast('Rejected and logged.'); } });
    },
    upload: function () { $('#upfile').click(); },
    assign: function (b) { var x = D.handoffs.find(function (h) { return h.ref === b.dataset.id; }); x.advocate = $('#adv').value.split(' · ')[0]; x.status = 'Assigned'; log('Assigned ' + x.ref + ' to ' + x.advocate); D.sel.handoff = null; render(); toast(x.ref + ' assigned to ' + x.advocate + '. The user gets an SMS.'); },
    'handoff-done': function (b) { var x = D.handoffs.find(function (h) { return h.ref === b.dataset.id; }); x.status = 'Done'; log('Closed ' + x.ref); D.sel.handoff = null; render(); toast(x.ref + ' closed.'); },
    'add-adv': function () {
      modal({ title: 'Add an advocate to the panel', submit: 'Add advocate', body: fld('Name', '<input id="ad-n" placeholder="Adv. full name">') + fld('District', '<input id="ad-d" placeholder="e.g. Khulna">') + fld('Bar enrolment', '<input id="ad-e" placeholder="e.g. Khulna Bar 1234">') + '<p class="lead">Check the enrolment with the Bar Council before adding.</p>',
        onSubmit: function () { var n = $('#ad-n').value.trim(), d = $('#ad-d').value.trim(), e = $('#ad-e').value.trim(); if (!n || !d || !e) return 'Fill in all three fields.'; ADVOCATES.push({ name: /^Adv/.test(n) ? n : 'Adv. ' + n, district: d, enrol: e }); log('Added ' + n + ' (' + d + ') to the advocate panel'); render(); toast('Added to the panel.'); } });
    },
    reset: function (b) { var u = D.users[+b.dataset.i]; log('Sent a password reset to ' + u[0]); toast('Reset link sent to ' + u[0] + '.'); },
    suspend: function (b) {
      var u = D.users[+b.dataset.i];
      if (u[4] !== 'Active') { u[4] = 'Active'; log('Restored ' + u[0]); render(); toast(u[0] + ' restored.'); return; }
      modal({ title: 'Suspend ' + u[0] + '?', danger: true, submit: 'Suspend', body: '<p class="lead">They cannot sign in until restored. Their workspace and matters are kept.</p>' + fld('Reason for the log', '<input id="sp" placeholder="e.g. Abusive messages reported">'),
        onSubmit: function () { var why = $('#sp').value.trim(); if (!why) return 'Add a reason.'; u[4] = 'Suspended'; log('Suspended ' + u[0] + ': ' + why); render(); toast(u[0] + ' suspended.'); } });
    },
    'rm-topic': function (b) { var t = D.settings.topics.splice(+b.dataset.i, 1)[0]; render(); toast('"' + t + '" removed. Save to apply.'); },
    'add-topic': function () { var v = $('#new-topic').value.trim(); if (!v) return; D.settings.topics.push(v); render(); toast('"' + v + '" added. Save to apply.'); },
    run: function () { runCheck('Run by supervisor'); }
  };

  document.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#app').classList.remove('nav-open'); if (e.key === 'Enter' && e.target.id === 'new-topic') { e.preventDefault(); A['add-topic'](); } });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { D.q = e.target.value; var pos = e.target.selectionStart; render(); var f = $('#q'); f.focus(); f.setSelectionRange(pos, pos); } });
  document.addEventListener('change', function (e) {
    var m = /^area(\d)$/.exec(e.target.id);
    if (m) { var a = D.areas[+m[1]]; a.on = e.target.checked; if (a.on && a.state !== 'Live') { a.on = false; e.target.checked = false; toast(a.name + ' is not ready yet: its quality check has not passed.'); } else { log((a.on ? 'Turned on ' : 'Turned off ') + a.name + ' answers'); toast(a.name + ' answers ' + (a.on ? 'on.' : 'off. Users get "not found" for ' + a.name.toLowerCase() + ' questions.')); } }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'settings-form') return;
    e.preventDefault();
    var s = D.settings, lim = +$('#st-limit').value;
    if (!$('#st-bn').checked && !$('#st-en').checked) { toast('Keep at least one answer language on.'); return; }
    if (!(lim >= 10 && lim <= 1000)) { toast('Questions per day must be between 10 and 1000.'); return; }
    var state = $('#save-state'); state.textContent = 'Checking against the 150 reference questions…';
    e.target.querySelector('button[type=submit]').disabled = true;
    runCheck('Settings change', function (r) {
      if (passes(r)) {
        s.disclaimer = $('#st-disc').value.trim() || s.disclaimer; s.showDate = $('#st-date').checked; s.style = $('#st-style').value; s.limit = lim;
        s.bn = $('#st-bn').checked; s.en = $('#st-en').checked; s.fallback = $('#st-fb').checked;
        log('Changed assistant settings'); render(); toast('Check passed. The new settings are live.');
      } else { render(); toast('Check failed, so nothing changed. See Quality checks.'); }
    });
  });
  $('#upfile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; e.target.value = '';
    var u = { name: f.name, busy: true, pct: 0, step: 'Reading the PDF' }; D.uploads.push(u); D.tab.library = 'updates'; go('library'); log('Uploaded ' + f.name);
    var steps = ['Reading the PDF', 'Converting old Bijoy text to Unicode', 'Reading scanned pages (OCR)', 'Splitting into sections'], k = 0;
    (function tick() {
      k += 1; u.pct = Math.min(100, k * 10); u.step = steps[Math.min(steps.length - 1, Math.floor(k / 3))];
      if (k < 10) { if (D.view === 'library') render(); setTimeout(tick, 400); return; }
      u.busy = false; D.updates.unshift({ id: 'up' + Date.now(), act: f.name.replace(/\.[^.]+$/, ''), sec: 'New document', what: 'Uploaded · OCR done, ready to approve', found: 'Uploaded by supervisor · ' + NOW, from: '7 Mar 2027' });
      if (D.view === 'library') render(); toast(f.name + ' is ready to approve.');
    })();
  });

  render();
})();
</script>
</body>
</html>
